<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Survey Form</title>
  </head>

  <body>
    <h1 id="title">Survey Form</h1>
    <p id="description">Thank you for taking the time to help us improve the platform</p>
    <form id="survey-form">
      <div>
        <label for="name" id="name-label">Name</label>
        <input id="name" type="text" placeholder="Enter your name" required>
      </div>
      <div>
        <label for="email" id="email-label">Email</label>
        <input id="email" placeholder="Enter your Email" type="email" required>
      </div>
      <div>
        <label for="number" id="number-label">Age (Optional)</label>
        <input type="number" id="number" placeholder= "Age" min="3" max="100">
      </div>
      <div>
        <p>Select your prefered color</p>
        <select id="dropdown">
          <option disabled selected>Select</option>
          <option>Black</option>
          <option>White</option>
          <option>Blue</option>
          <option>Grey</option>
        </select>
      </div>
      <div>
        <p>Choose Brand</p>
        <input type="radio" value="iphone" name="MobileBrand" id="IPhone">
        <label for="IPhone">Iphone</label>
         <input type="radio" name="MobileBrand" value="samsung" id="Samsung">
        <label for="Samsung">Samsung</label>
         <input type="radio" value ="redmi" name="MobileBrand" id="Redmi">
        <label for="Redmi">Redmi</label>
         <input type="radio" value="nokia" name="MobileBrand" id="Nokia">
        <label for="Nokia">Nokia</label>
      </div>

      <div>
        <p>Preferred Quality</p>
        <input type="checkbox" value="performance" id="performance" name="quality">
        <label for="performance">Performance</label>
        <input type="checkbox" value="good-sound" id="good-sound" name="quality">
        <label for="good-sound">Good Sound</label>
        <input type="checkbox" value="battery" id="battery" name="quality">
        <label for="battery">Battery</label>
      </div>
      <div>
        <label>Additional Comments</label>
        <textarea row="10" name="comments"></textarea>
      </div>
      <div>
        <button id="submit">Submit</button>
      </div>
    </form>
  </body>
</html>
